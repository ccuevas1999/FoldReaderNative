# Convenience workflow if project is uploaded to GitHub as one ZIP from a phone.
# This workflow requires FoldReaderNative_Ready_for_GitHub.zip at the root of your repository.
name: Build APK from uploaded ZIP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'FoldReaderNative_Ready_for_GitHub.zip'
      - '.github/workflows/build.yml'
      - 'native-patches/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract project uploaded from phone
        run: |
          mkdir -p project
          unzip -q FoldReaderNative_Ready_for_GitHub.zip -d project
          test -f project/FoldReaderNative/app/build.gradle.kts
          # Use the bundled launcher icon when the source references a missing drawable.
          sed -i 's|@drawable/ic_book_launcher_1794373273989|@mipmap/ic_launcher|g' project/FoldReaderNative/app/src/main/res/drawable/ic_launcher_foreground.xml
          # Compose restricted gesture scopes cannot call scrollToPage directly.
          sed -i 's/latestPagerState.scrollToPage(target)$/coroutineScope.launch { latestPagerState.scrollToPage(target) }/' project/FoldReaderNative/app/src/main/java/com/example/reader/BookTurnPager.kt
      - name: Apply native fullscreen reader and formatting fixes
        run: |
          cp native-patches/MainActivity.kt project/FoldReaderNative/app/src/main/java/com/example/MainActivity.kt
          mkdir -p project/FoldReaderNative/app/src/main/assets
          cp native-patches/fold_reader.html project/FoldReaderNative/app/src/main/assets/fold_reader.html
          cp native-patches/v10.js project/FoldReaderNative/app/src/main/assets/v10.js
          cp native-patches/v10.css project/FoldReaderNative/app/src/main/assets/v10.css
          cp native-patches/v11.js project/FoldReaderNative/app/src/main/assets/v11.js
          cp native-patches/v12.js project/FoldReaderNative/app/src/main/assets/v12.js
          cp native-patches/v12.css project/FoldReaderNative/app/src/main/assets/v12.css
          python - <<'PYCODE'
          from pathlib import Path
          p=Path('project/FoldReaderNative/app/src/main/assets/fold_reader.html')
          html=p.read_text()
          assert '</head>' in html and '</body></html>' in html
          if 'v10.css' not in html:
              html=html.replace('</head>', '<link rel="stylesheet" href="v10.css"></head>',1)
          if 'v10.js' not in html:
              html=html.replace('</body></html>', '<script src="v10.js"></script><script src="v11.js"></script></body></html>',1)
          elif 'v11.js' not in html:
              html=html.replace('<script src="v10.js"></script>', '<script src="v10.js"></script><script src="v11.js"></script>',1)
          if 'v12.css' not in html:
              html=html.replace('</head>', '<link rel="stylesheet" href="v12.css"></head>',1)
          if 'v12.js' not in html:
              html=html.replace('</body></html>', '<script src="v12.js"></script></body></html>',1)
          p.write_text(html)
          PYCODE
          python native-patches/generate_sound.py project/FoldReaderNative/app/src/main/assets/page_turn.wav
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|uiMode"/' project/FoldReaderNative/app/src/main/AndroidManifest.xml
          echo 'dependencies { implementation("androidx.webkit:webkit:1.12.1") }' >> project/FoldReaderNative/app/build.gradle.kts
          cat native-patches/stable-signing.gradle.kts >> project/FoldReaderNative/app/build.gradle.kts
      - name: Configure permanent APK signing when GitHub secrets are present
        env:
          KEYSTORE_B64: ${{ secrets.FOLD_READER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FOLD_READER_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            python - <<'PYCODE'
            import os, base64, hashlib, pathlib, sys
            text=os.environ['KEYSTORE_B64']
            try:
                decoded=base64.b64decode(''.join(text.split()),validate=True)
            except Exception:
                print('::error::FOLD_READER_KEYSTORE_BASE64 is not valid base64. Copy only the long value from GitHub_Secrets.txt.')
                sys.exit(1)
            expected='b6823a08ae04949fc8014695f3c9e80662f340d3d135f4d6eabf29a56df65056'
            if hashlib.sha256(decoded).hexdigest()!=expected:
                print('::error::The keystore secret does not match the original signing certificate. Re-copy the entire long value from GitHub_Secrets.txt; do not upload the ZIP.')
                print('Received decoded byte count:',len(decoded),'; expected: 3536')
                sys.exit(1)
            target=pathlib.Path('project/FoldReaderNative/foldreader.p12')
            target.write_bytes(decoded)
            target.chmod(0o600)
            print('Permanent signing certificate data validated.')
            PYCODE
            echo "FOLD_SIGNING_PATH=$GITHUB_WORKSPACE/project/FoldReaderNative/foldreader.p12" >> "$GITHUB_ENV"
            echo "FOLD_SIGNING_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FOLD_SIGNING_STATUS=stable" >> "$GITHUB_ENV"
          else
            echo "::error::Permanent signing secrets are missing. No updateable APK will be produced."
            exit 1
          fi
      - name: Build debug APK
        working-directory: project/FoldReaderNative
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify the APK signature
        run: |
          APK=$(find project/FoldReaderNative/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          echo "Permanent signing verification passed."
      - uses: actions/upload-artifact@v4
        with:
          name: FoldReader-Stable-Updateable-APK
          path: project/FoldReaderNative/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error