# Convenience workflow if project is uploaded to GitHub as one ZIP from a phone.
# This workflow requires FoldReaderNative_Ready_for_GitHub.zip at the root of your repository.
name: Build APK from uploaded ZIP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'FoldReaderNative_Ready_for_GitHub.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract project uploaded from phone
        run: |
          mkdir -p project
          unzip -q FoldReaderNative_Ready_for_GitHub.zip -d project
          test -f project/FoldReaderNative/app/build.gradle.kts
          # Use the bundled launcher icon when the source references a missing drawable.
          sed -i 's|@drawable/ic_book_launcher_1794373273989|@mipmap/ic_launcher|g' project/FoldReaderNative/app/src/main/res/drawable/ic_launcher_foreground.xml
          # Compose restricted gesture scopes cannot call scrollToPage directly.
          sed -i 's/latestPagerState.scrollToPage(target)$/coroutineScope.launch { latestPagerState.scrollToPage(target) }/' project/FoldReaderNative/app/src/main/java/com/example/reader/BookTurnPager.kt
      - name: Apply native fullscreen reader and formatting fixes
        run: |
          cp native-patches/MainActivity.kt project/FoldReaderNative/app/src/main/java/com/example/MainActivity.kt
          mkdir -p project/FoldReaderNative/app/src/main/assets
          cp native-patches/fold_reader.html project/FoldReaderNative/app/src/main/assets/fold_reader.html
          cp native-patches/v10.js project/FoldReaderNative/app/src/main/assets/v10.js
          cp native-patches/v10.css project/FoldReaderNative/app/src/main/assets/v10.css
          python native-patches/generate_sound.py project/FoldReaderNative/app/src/main/assets/page_turn.wav
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|uiMode"/' project/FoldReaderNative/app/src/main/AndroidManifest.xml
          echo 'dependencies { implementation("androidx.webkit:webkit:1.12.1") }' >> project/FoldReaderNative/app/build.gradle.kts
      - name: Build debug APK
        working-directory: project/FoldReaderNative
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FoldReader-Native-APK
          path: project/FoldReaderNative/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error