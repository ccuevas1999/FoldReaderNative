function makePage(index){let l=leaf();l.firstChild.innerHTML=pages[index]||'';return l}function draw(index){let r=$('view');r.replaceChildren();for(let j=0;j<cols;j++)r.append(makePage(index*cols+j));$('pageCount').textContent=(index+1)+' / '+Math.max(1,Math.ceil(pages.length/cols));$('progress').max=Math.max(0,Math.ceil(pages.length/cols)-1);$('progress').value=index;let b=books[bookId];if(b)persistPosition()}function setSpread(n){spread=Math.max(0,Math.min(n,Math.ceil(pages.length/cols)-1));draw(spread)}function previewSeek(v){$('pageCount').textContent=(+v+1)+' / '+Math.max(1,Math.ceil(pages.length/cols))}function seek(v){if(!drag)setSpread(+v)}function toc(show){$('toc').style.display=show?'block':'none';if(show)$('read').classList.remove('hideHud')}function keepSettings(){anim=$('animation').value;localStorage.foldFx=anim}function toggleSound(){sound=!sound;localStorage.foldSound=sound?'1':'0';$('sndBtn').textContent=sound?'Sound on':'Sound off'}function appearance(){modal('<h2>Reading settings</h2><p>Page background</p><div class="actions"><button onclick="paperChange(\'white\')">White</button><button onclick="paperChange(\'dark\')">Dark</button></div><div class="actions"><button onclick="hidePanel()">Done</button></div><p class="muted">Paper colors apply only to the book.</p>')}function paperChange(v){paper=v;localStorage.foldPaper=v;$('read').dataset.paper=v}function scheduleReflow(){clearTimeout(reflowTimer);let source=bookId,anchor=pages.length?spread*cols/pages.length:0;statusText('Preparing text size…');reflowTimer=setTimeout(async()=>{if(bookId!==source)return;let ok=await paginate();if(ok&&bookId===source){setSpread(Math.round(anchor*pages.length/cols));statusText('')}else if(bookId===source)statusText('Formatting interrupted')},230)}function rustle(){if(!sound)return;try{let a=new(window.AudioContext||window.webkitAudioContext)(),n=(a.sampleRate*.28)|0,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let k=0;k<n;k++)d[k]=(Math.random()*2-1)*Math.sin(Math.PI*k/n)*.14;let s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=1200;g.gain.value=.4;s.connect(f);f.connect(g);g.connect(a.destination);s.start();s.onended=()=>a.close()}catch(e){}}

function visual(d,p){let q=Math.max(0,Math.min(1,p)),sh=$('view').querySelector('.turnSheet');if(!sh)return;let angle=(d.dir>0?-180:180)*q;sh.style.transform='rotateY('+angle+'deg)';sh.style.setProperty('--sheetShade',String(Math.sin(q*Math.PI)*.8))}
function startTurn(dir,touchY){if(working||bookId<0)return false;let to=spread+dir,max=Math.ceil(pages.length/cols)-1;if(to<0||to>max)return false;working=true;let from=spread,r=$('view'),side=dir>0?cols-1:0,under=r.children[side],oldPage=from*cols+side,newPage=to*cols+side;
let sheet=document.createElement('div');sheet.className='turnSheet';sheet.style.width=(100/cols)+'%';sheet.style.left=(side*100/cols)+'%';sheet.style.transformOrigin=dir>0?'left center':'right center';
let front=makePage(oldPage),back=makePage(to*cols+(dir>0?0:cols-1));front.classList.add('frontLeaf');back.classList.add('backLeaf');sheet.append(front,back);r.replaceChild(makePage(newPage),under);r.append(sheet);drag={from,to,dir,p:0,touchY};visual(drag,0);return true}
function settle(commit){if(!drag)return;let d=drag,first=d.p,end=commit?1:0,start=performance.now(),duration=commit?Math.max(160,470*(1-first)):190;function step(t){let f=Math.min(1,(t-start)/duration),p=first+(end-first)*(1-Math.pow(1-f,2.5));visual(d,p);if(f<1)requestAnimationFrame(step);else{drag=null;working=false;setSpread(commit?d.to:d.from);if(commit)rustle()}}requestAnimationFrame(step)}
function turn(dir){if(bookId<0||working)return;if(anim==='Instant'){let next=spread+dir,max=Math.ceil(pages.length/cols)-1;if(next<0||next>max)return;setSpread(next);rustle();return}if(startTurn(dir,50))settle(true)}
let down=null,view=$('view');view.addEventListener('pointerdown',e=>{if(bookId<0||working)return;let box=view.getBoundingClientRect(),x=(e.clientX-box.left)/box.width,dir=x>.76?1:x<.24?-1:0;down={id:e.pointerId,x:e.clientX,y:e.clientY,dir,moved:false};if(dir)view.setPointerCapture(e.pointerId)});
view.addEventListener('pointermove',e=>{if(!down||!down.dir||e.pointerId!==down.id)return;let dx=e.clientX-down.x;if(Math.abs(dx)>7)down.moved=true;if(!down.moved)return;let q=Math.max(0,(down.dir>0?-dx:dx)/(view.clientWidth/cols));if(!drag){if(q<.025||!startTurn(down.dir,(e.clientY-view.getBoundingClientRect().top)/view.clientHeight*100))return}drag.p=Math.min(1,q);visual(drag,drag.p);e.preventDefault()},{passive:false});
function end(e){if(!down)return;let was=down;down=null;if(drag){settle(drag.p>.22);return}if(was.dir&&Math.abs(e.clientX-was.x)<10){turn(was.dir);return}if(!was.dir&&Math.abs(e.clientX-was.x)<10)$('read').classList.toggle('hideHud')}
view.addEventListener('pointerup',end);view.addEventListener('pointercancel',()=>{down=null;if(drag)settle(false)});
let resizeTimer,lastDims='';window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{let dims=$('view').clientWidth+'x'+$('view').clientHeight;if(bookId>=0&&lastDims!==dims){lastDims=dims;scheduleReflow()}},180)});
const waitingNative=new Map();
function nativeImport(id){return new Promise((resolve,reject)=>{let timeout=setTimeout(()=>{waitingNative.delete(id);reject(Error('Import timed out'))},90000);waitingNative.set(id,{resolve,reject,timeout});FoldBridge.importDocument(id)})}
window.foldNativeLoaded=function(id,ok,info){let w=waitingNative.get(id);if(!w)return;clearTimeout(w.timeout);waitingNative.delete(id);ok?w.resolve('/docs/'+id+'.html'):w.reject(Error(info||'Download failed'))};
window.foldAddUrl=function(url){let m=url.match(/docs\.google\.com\/document\/(?:u\/\d+\/)?d\/([\w-]+)/);if(!m)return;let u='https://docs.google.com/document/d/'+m[1]+'/edit';let at=books.findIndex(b=>b.u===u);if(at<0){books.push({t:'Google Doc',u,c:'',h:'',cover:books.length%6,img:'',pos:0});save();at=books.length-1}shelf();openBook(at)};
window.foldBackPressed=function(){if($('shade').style.display==='flex'){hidePanel();return}if($('toc').style.display==='block'){$('toc').style.display='none';return}if(bookId>=0){back();return}FoldBridge.finishReader()};
if(window.FoldBridge){try{let old=JSON.parse(FoldBridge.getLegacyDocs()||'[]');for(let x of old){if(x.url&&!books.some(b=>b.u===x.url))books.push({t:x.title||'Google Doc',u:x.url,c:'',h:'',cover:books.length%6,img:'',pos:Number(x.lastPage)||0})}save()}catch(e){console.warn('Migration skipped',e)}}
const originalEnter=enter;enter=async function(){if(window.FoldBridge)FoldBridge.setReaderMode(true);return originalEnter()};
const originalBack=back;back=function(){originalBack();if(window.FoldBridge)FoldBridge.setReaderMode(false)};
if(window.FoldBridge){openDocs=function(){let b=books[bookId];if(!b?.u)return;modal('<h2>Edit source</h2><p>Open this document in Google Docs? Your reading position will be preserved.</p><div class="actions"><button id="nativeEdit">Open in Google Docs</button><button onclick="hidePanel()">Cancel</button></div>');$('nativeEdit').onclick=()=>FoldBridge.openEditor(b.u)}}
shelf();
</script></body></html>
